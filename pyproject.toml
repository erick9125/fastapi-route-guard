[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-route-guard"
version = "0.1.0"
description = "Declarative resource-level authorization for FastAPI with ownership, roles, scopes, tenant context, and extensible async policy evaluation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Erick Morales" },
]
keywords = [
    "fastapi",
    "python",
    "authorization",
    "security",
    "rbac",
    "abac",
    "access-control",
    "multi-tenant",
    "api-security",
    "pydantic",
    "asyncio",
    "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/erick9125/fastapi-route-guard"
Repository = "https://github.com/erick9125/fastapi-route-guard"
Issues = "https://github.com/erick9125/fastapi-route-guard/issues"
Changelog = "https://github.com/erick9125/fastapi-route-guard/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "uvicorn>=0.30",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/README.md",
    "/README.es.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["RUF012", "B008"]
"examples/**/*.py" = ["RUF012", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["fastapi_route_guard"]
mypy_path = "src"
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["fastapi_route_guard"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
]
