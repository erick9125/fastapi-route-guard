name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term-missing
      - run: uv build
      - name: Check the metadata of both artifacts
        run: uvx twine check --strict dist/*
      - name: Install the wheel into a clean environment and import it
        run: |
          set -euo pipefail
          uv venv --no-project .wheelcheck
          uv pip install --python .wheelcheck/bin/python dist/*.whl
          # No source tree on the path: this imports the wheel, not the checkout.
          cd .wheelcheck
          ./bin/python -c "
          import fastapi_route_guard as guard
          from fastapi_route_guard import PolicyEvaluator, RouteGuard, make_principal
          from fastapi_route_guard.integrations.fastapi import AuthorizationDenied
          from importlib.resources import files
          assert files('fastapi_route_guard').joinpath('py.typed').is_file(), 'py.typed missing'
          print('imported', guard.__version__)
          "
